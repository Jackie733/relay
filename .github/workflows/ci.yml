name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - if: runner.os != 'Windows'
        run: |
          python3 -m venv "$RUNNER_TEMP/relay-ui"
          "$RUNNER_TEMP/relay-ui/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/relay-ui/bin/python" scripts/smoke_tui.py target/release/relay

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --workspace --all-targets --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  ssh-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/integration/prepare.sh
      - run: docker compose -f tests/integration/compose.yml up --build --wait
      - run: sh tests/integration/check.sh
      - run: cargo test --workspace --locked -- --ignored
      - run: |
          cargo build --locked
          python3 -m venv "$RUNNER_TEMP/relay-ssh-ui"
          "$RUNNER_TEMP/relay-ssh-ui/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/relay-ssh-ui/bin/python" scripts/smoke_tui.py target/debug/relay --ssh-fixtures
      - if: always()
        run: docker compose -f tests/integration/compose.yml down --volumes
